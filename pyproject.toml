[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-router"
version = "0.1.0"
description = "Typed Jev decision client and agent routing foundation"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.128.8,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.39.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["jev_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
ignore = ["UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Depends() in a default argument is the documented FastAPI idiom.
"apps/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
